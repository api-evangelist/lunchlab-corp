aid: lunchlab-corp
name: lunchlab Corp.
description: >-
  lunchlab Corp. (런치랩) is a Seoul-based corporate lunch subscription and delivery
  service that brings daily meals to office teams across South Korea. It offers two
  rotating meal lines — a traditional home-style Korean lunch box and a "Fresh Meal"
  line of poke bowls and sandwiches — with delivery and pickup included for a flat
  per-meal price, employees choosing their meals through a mobile app while
  administrators manage orders and billing from a web dashboard. Surfaced as a
  500 Global portfolio company and added to the API Evangelist network, lunchlab
  operates in the food-service / corporate-catering space and does not currently
  publish a public developer API, developer portal, or SDKs.
